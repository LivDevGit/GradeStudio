# GradeNet-L v4: more and more varied people. v3 plus ~22k Open Images
# people photos (CC BY 2.0, scripts/download_openimages_people.py; quality
# filtered by the v3 critic and black and white dropped, filter_quality.py).
# Open Images is sampled at weight 0.4, so ~40% of samples have a person
# (v2: 35%), Unsplash people keep the x2.5 boost. Init from v3.
name: grade_local_v4
seed: 3
arch: local

model:
  k: 4
  n_luts: 32
  lut_size: 33
  width: 24
  hidden: 640
  bins3d: 8
  grid_bins: 8

data:
  images: unsplash/images_384
  maps: unsplash/scene_192
  val_every_nth: 50
  val_samples: 1500
  extra:
    - images: openimages/images_384
      maps: openimages/scene_192
      keep: openimages/quality.json
      val_every_nth: 50
      weight: 0.4
  p_clean: 0.15
  p_none: 0.25
  p_local: 0.6
  person_boost: 2.5
  p_person_crop: 0.5
  batch_size: 32
  workers: 10

train:
  epochs: 12
  lr: 2.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 300
  lambda_smooth: 1.0e-4
  lambda_mono: 1.0
  lambda_grid: 1.0e-3
  w_person: 3.0
  w_skin: 2.0
  eval_every: 2
