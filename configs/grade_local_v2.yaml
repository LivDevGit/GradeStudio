# GradeNet-L v2: people and skin. Fine-tuned from grade_local_v1 (--init):
#  - targets add skin finishing (grademl.local_looks.skin_finish): skin keeps
#    a natural tone under every look, a little light on faces
#  - inputs add color casts on the subject only (foliage bounce, shade, mixed light)
#  - people oversampled (~10% of Unsplash -> ~35% of samples) and half of
#    their crops centered on the person, so faces are larger
#  - loss weighted toward people (x4) and skin (x6)
name: grade_local_v2
seed: 1
arch: local

model:
  k: 4
  n_luts: 32
  lut_size: 33
  width: 24
  hidden: 640
  bins3d: 8
  grid_bins: 8

data:
  images: unsplash/images_384
  maps: unsplash/scene_192
  val_every_nth: 50
  val_samples: 1500
  p_clean: 0.15
  p_none: 0.25
  p_local: 0.6
  person_boost: 5.0
  p_person_crop: 0.5
  batch_size: 32
  workers: 6

train:
  epochs: 20
  lr: 2.5e-4
  weight_decay: 1.0e-4
  warmup_steps: 300
  lambda_smooth: 1.0e-4
  lambda_mono: 1.0
  lambda_grid: 1.0e-3
  w_person: 3.0
  w_skin: 2.0
  eval_every: 2
